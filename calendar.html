<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="chat.css">
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <link rel="stylesheet" href="calendar.css">
 <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
  <script src="chat.js?v=20260503"></script>
 <title>Calendar</title>
</head>
<body>
  <nav>
    <div id="navBar">
      <div id="home" class="icon">
        <a href="index.html"><img id="homeIcon" class="iconImg" src="home.png">
        <div class="line"></div>
        <p id="homeLabel" class="label">Home</p></a>
      </div>
      <div id="directory" class="icon">
        <a href="sportsDirectory.html"><img id="directoryIcon" class="iconImg" src="directory.png">
        <div class="line"></div>
        <p id="directoryLabel" class="label">Directory</p></a>
      </div>
      <div id="about" class="icon">
        <a href="aboutus.html"><img id="aboutIcon" class="iconImg" src="about.png">
        <div class="line"></div>
        <p id="aboutLabel" class="label">About Us</p></a>
      </div>
      <div id="feedback" class="icon">
        <a href="feedback.html"><img id="feedbackIcon" class="iconImg" src="feedback.png">
        <div class="line"></div>
        <p id="feedbackLabel" class="label">Feedback</p></a>
      </div>
      <div id="calendar" class="icon">
        <a href="calendar.html"><img id="calendarIcon" class="iconImg" src="calendar.png">
        <div class="line"></div>
        <p id="calendarLabel" class="label">Calendar</p></a>
      </div>
      <div id="sources" class="icon">
        <a href="sources.html"><img id="sourcesIcon" class="iconImg" src="sources.png">
        <div class="line"></div>
        <p id="sourcesLabel" class="label">Reference Page</p></a>
      </div>
    </div>
  </nav>
    <div id="chatbot">
    <img id="chatIcon" src="comment.png" onclick="openChat()">
    <div id="chatWindow">
      <img id="closeIcon" src="cross.png" onclick="closeChat()">
      <h3 id="chatTitle">Chat with us</h3>
      <p id="chatText">How can we help you?</p>
      <div id="chatMessages"></div>
      <div id="chatInputSection">
        <input type="text" placeholder="Ask anything!" id="chatInput">
        <button id="submitButton" type="submit"><img id="submitImg" src="paper-plane.png" alt="Send"></button>
      </div>
    </div>
  </div>
    <div id="topSection">
       <img id="topLogo" src="logo.png" alt="logo">
       <h1 id="calendarText">CALENDAR</h1>
   </div>
</body>
<div class="calendar-container">
<div class="calendar">
    <div class="header">
        <button id="prevBtn" class="arrowbtn">
            <i class="fas fa-chevron-left"></i>
        </button>
        <div class="monthYear" id="monthYear"></div>
        <button id="nextBtn" class="arrowbtn">
            <i class="fas fa-chevron-right"></i>
        </button>
    </div>
    <div class="days">
        <div class="day"><p class="dayText">Sun</p></div>
        <div class="day"><p class="dayText">Mon</p></div>
        <div class="day"><p class="dayText">Tue</p></div>
        <div class="day"><p class="dayText">Wed</p></div>
        <div class="day"><p class="dayText">Thu</p></div>
        <div class="day"><p class="dayText">Fri</p></div>
        <div class="day"><p class="dayText">Sat</p></div>
    </div>
    <div class="dates" id="dates"></div>
</div>
<script src="calendar.js"></script>
</calendar>

<div id="eventSection">
    <h2 class="eventsTitle">Events</h2>
    <div id="eventList"><p class="eventsListText">Click a day to see events</p></div>
</div>



  <footer>
    <div id="footerSection">
      <div id="contactUsSection">
        <h2 id="footerTitle" class="footerText">CONTACT US</h2>
        <p id="phoneNumber" class="footerText footerInfo">720-487-3920</p>
        <p id="email" class="footerText footerInfo">milehighmovement@gmail.com</p>
        <p id="address" class="footerText footerInfo">3782 Movement Circle</p>
      </div>
      <div id="socialsSection">
        <div id="faceboockCircle" class="social top">
          <img id="facebookIcon" class="socialIcon" src="facebook.png">
        </div>
        <div id="instagramCircle" class="social left">
          <img id="instagramIcon" class="socialIcon" src="instagram.png">
        </div>
        <div id="twitterCircle" class="social right">
          <img id="twitterIcon" class="socialIcon" src="twitter-alt.png">
        </div>
        <div id="linkedinCircle" class="social bottom">
          <img id="linkedinIcon" class="socialIcon" src="linkedin.png">
        </div>
      </div>
      <div id="logoSection">
        <img id="footerLogo" src="logo.png" alt="logo">
      </div>
    </div>
  </footer>
</html>
