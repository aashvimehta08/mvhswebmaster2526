<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="feedback.css">
    <title>Document</title>
</head>
<body>
    <div id="titleSection">
        <h1>FEEDBACK</h1>
    </div>


    
    <div class = "form-box">
        <div class="title">
            <h2>How can we improve your experience?</h2>
            <p>Let us know below</p>
        </div>
    </div>

    <br> 
    <br>
    <br> 
    <br>
    <br> 
    <br>
    <br> 
    <br>

        <form class="feedback-form">

            <div class="field-group">
                <select required>
                    <option value="" disabled selected hidden>Category of Need</option>
                    <option value="consulting">Usability</option>
                    <option value="booking">Content Quality</option>
                    <option value="design">Performance</option>
                    <option value="other">Satisfaction</option>
                </select>
    
            </div>

            <br>

            <div class="form-group">
                <input type="text" placeholder="Full Name" required>
            </div>
            
            <br>
            
            <div class="form-group">
                <input type="text" placeholder="Email" required>
            </div>

            <br>

            <div class="text-group">
                <textarea placeholder="Your feedback" required></textarea>
            </div>

            <div class="submit">
                <button type="submit">Submit</button>
            </div>

        </form>
    <!-- </div>     -->


</body>
</html>
