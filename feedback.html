<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <link rel="stylesheet" href="feedback.css">
   <title>FeedbackPage</title>
</head>


<body>
    <nav>
    <div id="navBar">
      <div id="home" class="icon">
        <a href="homePage.html"><img id="homeIcon" class="iconImg" src="home.png">
        <div class="line"></div>
        <p id="homeLabel" class="label">Home</p></a>
      </div>
      <div id="directory" class="icon">
        <a href="sportsDirectory.html"><img id="directoryIcon" class="iconImg" src="directory.png">
        <div class="line"></div>
        <p id="directoryLabel" class="label">Directory</p></a>
      </div>
      <div id="about" class="icon">
        <a href="aboutus.html"><img id="aboutIcon" class="iconImg" src="about.png">
        <div class="line"></div>
        <p id="aboutLabel" class="label">About Us</p></a>
      </div>
      <div id="feedback" class="icon">
        <a href="feedback.html"><img id="feedbackIcon" class="iconImg" src="feedback.png">
        <div class="line"></div>
        <p id="feedbackLabel" class="label">Feedback</p></a>
      </div>
      <div id="calendar" class="icon">
        <a href="calendar.html"><img id="calendarIcon" class="iconImg" src="calendar.png">
        <div class="line"></div>
        <p id="calendarLabel" class="label">Calendar</p></a>
      </div>
      <div id="sources" class="icon">
        <a href="sources.html"><img id="sourcesIcon" class="iconImg" src="sources.png">
        <div class="line"></div>
        <p id="sourcesLabel" class="label">Sources</p></a>
      </div>
    </div>
  </nav>
   <div id="topSection">
       <img id="topLogo" src="logo.png" alt="logo">
       <h1 id="feedbackText">FEEDBACK</h1>
   </div>


   <div id="formBox" class="formBox">
       <div id="formBoxtitle" class="title">
           <h2>How can we improve your experience?</h2>
           <p>Let us know below!</p>
       </div>


       <form id="feedbackForm" class="feedbackForm">


           <div id="catagory" class="catagory">
               <select id="selectSection" required>
                   <option value="" disabled selected hidden>Category of Need</option>
                   <option value="usability">Usability</option>
                   <option value="contentQuality">Content Quality</option>
                   <option value="performance">Performance</option>
                   <option value="satisfation">Satisfaction</option>
               </select>
           </div>


           <div id="nameInputSection">
               <input class="IDinput" type="text" placeholder=" Full Name" required>
           </div>
  
           <div id="emailInputSection">
               <input class="IDinput" type="text" placeholder=" Email" required>
           </div>


           <div id="mainFeedbackInput">
               <textarea class="mainFeedbackInput" placeholder= " Your feedback" required></textarea>
           </div>


           <div id="submitButton">
               <button class="submitButton" type="submit">Submit</button>
           </div>
       </form>
   </div>


       <div id=""whatsNextSection class="whatsNext">
           <h1 id="whatsNextTitle" class="whatsNextTitle">What's Next?</h1>
           <h2 id="whatsNextText" class="whatsNextText">
               You can always expect a response from our team within 3-5 Buisness Days.
           </h2>
       </div>
</body>
</html>
